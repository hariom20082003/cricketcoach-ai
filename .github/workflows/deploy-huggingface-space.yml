name: Deploy CricketCoach model to Hugging Face ZeroGPU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deployment client
        run: python -m pip install --disable-pip-version-check huggingface_hub
      - name: Upload Space application
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_SPACE_DEPLOY_TOKEN: ${{ secrets.HF_SPACE_DEPLOY_TOKEN }}
        run: python huggingface_space/deploy.py
